<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Repair - HBRTechMate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #f0f0f0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 16px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }
        button {
            background: #00d4ff;
            color: #000;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .status-card {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: left;
        }
        .status-pending { color: #f39c12; }
        .status-diagnosing { color: #3498db; }
        .status-repairing { color: #9b59b6; }
        .status-ready { color: #2ecc71; }
        .status-completed { color: #00d4ff; }
        .error {
            background: rgba(255,107,53,0.2);
            border: 1px solid #ff6b35;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            color: #ff6b35;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🔧 Track Your Repair Status</h2>
    <p>Enter your 10-digit mobile number</p>
    <input type="tel" id="phone" placeholder="9999999999">
    <button onclick="trackRepair()">Track Now</button>
    <div id="result"></div>
</div>

<script>
// Firebase Config - hardcoded
const firebaseConfig = {
    apiKey: "AIzaSyALYFAvawCvDobzjDuAJrsW4QUA-QII_qA",
    authDomain: "hbrtechmate.firebaseapp.com",
    projectId: "hbrtechmate",
    storageBucket: "hbrtechmate.firebasestorage.app",
    messagingSenderId: "842820976781",
    appId: "1:842820976781:web:3dc4bf7764d3d8fd61e2c4"
};

// Load Firebase dynamically
const loadFirebase = () => {
    return new Promise((resolve) => {
        if (typeof firebase !== 'undefined' && firebase.firestore) {
            resolve();
            return;
        }
        
        const script1 = document.createElement('script');
        script1.src = 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js';
        script1.onload = () => {
            const script2 = document.createElement('script');
            script2.src = 'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js';
            script2.onload = () => {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                resolve();
            };
            document.head.appendChild(script2);
        };
        document.head.appendChild(script1);
    });
};

let db = null;

async function trackRepair() {
    const resultDiv = document.getElementById('result');
    const phoneInput = document.getElementById('phone').value.trim();
    
    if (!phoneInput) {
        resultDiv.innerHTML = '<div class="error">❌ Please enter your phone number</div>';
        return;
    }
    
    // Get only digits
    let phoneDigits = phoneInput.replace(/\D/g, '');
    if (phoneDigits.length > 10) {
        phoneDigits = phoneDigits.slice(-10);
    }
    
    if (phoneDigits.length !== 10) {
        resultDiv.innerHTML = '<div class="error">❌ Please enter a valid 10-digit phone number</div>';
        return;
    }
    
    resultDiv.innerHTML = '<div style="text-align:center">🔍 Loading... Please wait.</div>';
    
    try {
        // Ensure Firebase is loaded
        await loadFirebase();
        
        if (!db) {
            db = firebase.firestore();
        }
        
        console.log("Searching for phone:", phoneDigits);
        
        // Search for the repair
        const snapshot = await db.collection('repairs')
            .where('phone', '==', phoneDigits)
            .orderBy('createdAt', 'desc')
            .limit(1)
            .get();
        
        console.log("Found:", snapshot.size);
        
        if (snapshot.empty) {
            resultDiv.innerHTML = '<div class="error">❌ No repair request found for this number.</div>';
            return;
        }
        
        const repair = snapshot.docs[0].data();
        const status = repair.status || 'Pending';
        
        let statusClass = 'status-pending';
        let statusMessage = '';
        
        switch(status) {
            case 'Pending':
                statusClass = 'status-pending';
                statusMessage = 'We have received your request. We will contact you shortly.';
                break;
            case 'Diagnosing':
                statusClass = 'status-diagnosing';
                statusMessage = 'Our technician is diagnosing your device.';
                break;
            case 'Repairing':
                statusClass = 'status-repairing';
                statusMessage = 'Your device is currently being repaired.';
                break;
            case 'Ready':
                statusClass = 'status-ready';
                statusMessage = '✅ Your device is ready for pickup! Please visit our store.';
                break;
            case 'Completed':
                statusClass = 'status-completed';
                statusMessage = '🎉 Repair completed. Thank you for choosing HBRTechMate!';
                break;
        }
        
        let dateStr = 'Recently';
        if (repair.createdAt && repair.createdAt.toDate) {
            dateStr = new Date(repair.createdAt.toDate()).toLocaleDateString();
        }
        
        resultDiv.innerHTML = `
            <div class="status-card">
                <h3>📱 ${repair.deviceType} ${repair.deviceModel || ''}</h3>
                <p><strong>Issue:</strong> ${repair.issue}</p>
                <p><strong>Status:</strong> <span class="${statusClass}"><strong>${status}</strong></span></p>
                <p><strong>Submitted on:</strong> ${dateStr}</p>
                <p><strong>Next step:</strong> ${statusMessage}</p>
                <hr>
                <p style="font-size: 12px;">📍 No 8/2, 1st Cross St, Nagawara Main Rd, Bengaluru 560045</p>
                <p style="font-size: 12px;">📞 Contact: 8105122693</p>
            </div>
        `;
        
    } catch (error) {
        console.error("Error:", error);
        resultDiv.innerHTML = '<div class="error">❌ Error: ' + error.message + '</div>';
    }
}
</script>
</body>
</html>
